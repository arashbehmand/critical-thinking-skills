[project]
name = "critical-thinking-skills"
version = "0.2.0"
description = "Critical-thinking skills for AI agents, plus a pure-math MCP server that aggregates the judgments they collect"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["fastmcp>=3.4,<4"]

[project.scripts]
ctmcp = "ctmcp.server.app:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctmcp"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "hooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# The math vocabulary (τ, σ) mirrors the argumentation literature; suppress
# ambiguous-unicode warnings, same as argLLM.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "hooks"]
# bench/ and its test file are untracked local-only measurement for now (.gitignore), so
# they are excluded here — a fresh clone has neither, and mypy must still come up green.
exclude = ["tests/test_bench\\.py"]
